; ElsExt settings. Place this file in the game folder next to ElsExt.asi.
; Per-model settings go in each vehicle's ELS file; see README.md.

; A vehicle is parked once it has stood still with its lights on for DelaySeconds. The driver
; may be in the vehicle or out of it.

[Park]
; Show each model's <Park> patterns while it is parked.
Enabled = 1
; Include the vehicle the player is driving.
PlayerCar = 1
; Seconds a vehicle must stand still before it counts as parked, for park patterns and sync.
; A model's Delay overrides this.
DelaySeconds = 2

[Sync]
; Flash parked vehicles of the same <Sync> group in step.
Enabled = 1
; Include the vehicle the player is driving.
PlayerCar = 1
; Maximum distance between synced vehicles, in metres. A model's Radius overrides this.
RadiusMetres = 60
